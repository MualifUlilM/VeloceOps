name: CI - Build & Typecheck

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Production Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://mock-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.mock-anon-key
          STRIPE_SECRET_KEY: sk_test_mock_stripe_key
          STRIPE_WEBHOOK_SECRET: whsec_mock_stripe_webhook_secret
